# Qivynex Trade — production stack.
#   db       PostgreSQL 16 (data in the "pgdata" volume, never exposed)
#   backend  FastAPI API (2 workers)
#   worker   trading engine (single instance)
#   web      nginx: dashboard + /api proxy, published on 127.0.0.1:${WEB_PORT}
#   capital  optional Capital.com connector (profile "capital")
#   ctrader  optional cTrader Open API connector (profile "ctrader")
#   caddy    optional automatic-HTTPS reverse proxy (profile "caddy"), used only
#            when the VPS has no existing web server on ports 80/443.
# Optional services are switched on with COMPOSE_PROFILES in .env (e.g. "caddy,ctrader").
name: qivynex-trade

x-app-env: &app-env
  APP_ENV: production
  PUBLIC_URL: https://${DOMAIN}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  SECRET_KEY: ${SECRET_KEY}
  COOKIE_SECURE: "true"
  INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-}
  INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
  BRIDGE_KEY_ID: ${BRIDGE_KEY_ID:-mt5-bridge-1}
  BRIDGE_SECRET: ${BRIDGE_SECRET}
  BRIDGE_ALLOWED_IPS: ${BRIDGE_ALLOWED_IPS:-}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
  SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-30}
  SESSION_MAX_HOURS: ${SESSION_MAX_HOURS:-12}
  TZ: UTC

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  backend:
    build: ./backend
    restart: unless-stopped
    environment: *app-env
    depends_on:
      db: { condition: service_healthy }
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]

  worker:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment: *app-env
    depends_on:
      db: { condition: service_healthy }
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      disable: true

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
    ports:
      - "127.0.0.1:${WEB_PORT:-8090}:8080"
    networks: [internal, edge]
    security_opt: ["no-new-privileges:true"]

  ctrader:
    # cTrader Open API connector (enable with COMPOSE_PROFILES=ctrader in .env,
    # or run deploy/setup-ctrader.sh). Replaces the Windows MT5 bridge.
    build: ./connectors/ctrader
    profiles: ["ctrader"]
    restart: unless-stopped
    environment:
      API_URL: http://backend:8000
      BRIDGE_KEY_ID: ${BRIDGE_KEY_ID:-mt5-bridge-1}
      BRIDGE_SECRET: ${BRIDGE_SECRET}
      CTRADER_CLIENT_ID: ${CTRADER_CLIENT_ID:-}
      CTRADER_CLIENT_SECRET: ${CTRADER_CLIENT_SECRET:-}
      CTRADER_ACCESS_TOKEN: ${CTRADER_ACCESS_TOKEN:-}
      CTRADER_REFRESH_TOKEN: ${CTRADER_REFRESH_TOKEN:-}
      CTRADER_ACCOUNT_LOGIN: ${CTRADER_ACCOUNT_LOGIN:-}
      SYMBOL_MAP: ${CTRADER_SYMBOL_MAP:-}
      MAX_VOLUME: ${CONNECTOR_MAX_VOLUME:-0.10}
      MAX_SPREAD_POINTS: ${CONNECTOR_MAX_SPREAD_POINTS:-30}
      ALLOW_REAL_ACCOUNT: ${ALLOW_REAL_ACCOUNT:-false}
      TZ: UTC
    volumes:
      - ctrader_state:/data
    depends_on:
      backend: { condition: service_healthy }
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]

  capital:
    # Capital.com REST API connector (enable with COMPOSE_PROFILES=capital in .env,
    # or run deploy/setup-capital.sh).
    build: ./connectors/capital
    profiles: ["capital"]
    restart: unless-stopped
    environment:
      API_URL: http://backend:8000
      BRIDGE_KEY_ID: ${BRIDGE_KEY_ID:-mt5-bridge-1}
      BRIDGE_SECRET: ${BRIDGE_SECRET}
      CAPITAL_API_KEY: ${CAPITAL_API_KEY:-}
      CAPITAL_IDENTIFIER: ${CAPITAL_IDENTIFIER:-}
      CAPITAL_API_PASSWORD: ${CAPITAL_API_PASSWORD:-}
      CAPITAL_ENV: ${CAPITAL_ENV:-demo}
      CAPITAL_ACCOUNT_ID: ${CAPITAL_ACCOUNT_ID:-}
      CAPITAL_UNITS_PER_SIZE: ${CAPITAL_UNITS_PER_SIZE:-}
      SYMBOL_MAP: ${CAPITAL_SYMBOL_MAP:-}
      MAX_VOLUME: ${CONNECTOR_MAX_VOLUME:-0.10}
      MAX_SPREAD_POINTS: ${CONNECTOR_MAX_SPREAD_POINTS:-30}
      ALLOW_REAL_ACCOUNT: ${ALLOW_REAL_ACCOUNT:-false}
      TZ: UTC
    volumes:
      - capital_state:/data
    depends_on:
      backend: { condition: service_healthy }
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]

  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    networks: [edge]

volumes:
  capital_state:
  ctrader_state:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  internal:
  edge:
