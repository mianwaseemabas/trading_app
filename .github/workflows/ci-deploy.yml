name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"  # daily: catches time/weekday-dependent failures and broken pins (tests only, never deploys)

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trader
          POSTGRES_PASSWORD: trader
          POSTGRES_DB: trading_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trader" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://trader:trader@localhost:5432/trading_test
      BRIDGE_SECRET: ci-bridge-secret-0123456789abcdef0123456789
      COOKIE_SECURE: "false"
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.lock -r backend/requirements-dev.txt
      - run: python -m pytest -q backend/tests

  connector-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r connectors/ctrader/requirements.lock -r connectors/capital/requirements.lock pytest
      - run: python -m pytest -q connectors/ctrader/tests
      - run: python -m pytest -q connectors/capital/tests

  frontend-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  deploy:
    # Auto-deploys to the VPS after tests pass on main, once these repository
    # secrets exist: VPS_HOST, VPS_USER, VPS_SSH_KEY (optional VPS_PORT).
    needs: [backend-tests, connector-tests, frontend-build]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    env:
      HAS_KEY: ${{ secrets.VPS_SSH_KEY != '' && secrets.VPS_HOST != '' }}
    steps:
      - name: Skip (deploy secrets not configured)
        if: env.HAS_KEY != 'true'
        run: echo "Set VPS_HOST, VPS_USER and VPS_SSH_KEY repository secrets to enable automatic deployment."
      - name: Deploy over SSH
        if: env.HAS_KEY == 'true'
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT || '22' }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          # Pinned server key (secret VPS_KNOWN_HOSTS = output of: ssh-keyscan -p PORT HOST) protects against a fake server.
          if [ -n "$KNOWN_HOSTS" ]; then printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts; else ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null; fi
          ssh -i ~/.ssh/id_deploy -p "$PORT" "$USER@$HOST" "sudo /opt/trading_app/deploy/update.sh"
