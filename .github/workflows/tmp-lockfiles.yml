name: tmp-lockfiles
on:
  push:
    branches: [claude/recommendations-2026-11]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p out
          for d in backend connectors/capital connectors/ctrader; do
            python -m venv /tmp/v-$$; . /tmp/v-$$/bin/activate
            pip install -q -r $d/requirements.txt
            { echo "# Pinned by CI from $d/requirements.txt (python 3.12). Regenerate after changing requirements.txt."; pip freeze --all | grep -v -E '^(pip|setuptools|wheel)=='; } > out/$(echo $d | tr / _).lock
            deactivate; rm -rf /tmp/v-$$
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with: {name: pylocks, path: out}
  node:
    runs-on: ubuntu-24.04
    container: node:22-alpine
    steps:
      - uses: actions/checkout@v4
      - run: cd frontend && npm install --package-lock-only --no-audit --no-fund && mkdir -p /tmp/o && cp package-lock.json /tmp/o/
      - uses: actions/upload-artifact@v4
        with: {name: npmlock, path: /tmp/o}
