# Serves the dashboard and proxies /api to the backend container.
# The outer reverse proxy (host nginx / Caddy / Traefik) terminates TLS.

# Trust X-Forwarded-For only from loopback and private (Docker) networks.
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

# Docker's DNS is asked again every 10 s, so a recreated backend container (new IP)
# never leaves nginx pointing at an old address (that caused 502 Bad Gateway).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 32m;

    root /usr/share/nginx/html;

    include /etc/nginx/conf.d/security_headers.inc;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # Connector-only endpoints (serve credentials) are never reachable from the internet.
    location ~ ^/api/bridge/(config|status|seed) { return 404; }

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    location /api/ {
        limit_req zone=api burst=60 nodelay;
        limit_req_status 429;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
        include /etc/nginx/conf.d/security_headers.inc;
        try_files $uri =404;
    }

    location = /manifest.json {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/security_headers.inc;
        try_files $uri =404;
    }

    location /icons/ {
        expires 30d;
        try_files $uri =404;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        include /etc/nginx/conf.d/security_headers.inc;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store" always;
        include /etc/nginx/conf.d/security_headers.inc;
        try_files $uri /index.html;
    }
}
